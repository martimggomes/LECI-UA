<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multipower - Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom, #f5f5f5, #e0e0e0);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      background-color: #fff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
    }

    .logo {
      width: 180px;
      margin-bottom: 30px;
    }

    .question-text {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 30px;
      color: #333;
    }

    .button-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .role-button {
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 25px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .role-button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="imagesHTML/bemvindo.png" alt="Multipower Logo" class="logo" />

    <div class="question-text">Como deseja utilizar a plataforma?</div>

    <div class="button-container">
      <button class="role-button" onclick="location.href='cliente.html'">Cliente</button>
      <button class="role-button" onclick="location.href='criacaocontaforne.html'">Fornecedor</button>
    </div>
  </div>
</body>
</html>
