<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>MULTIPOWER - Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    img.logo {
      width: 180px;
      margin-bottom: 20px;
    }

    .login-box {
      background-color: #dadada;
      padding: 40px 30px;
      border-radius: 30px;
      width: 350px;
      box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
      text-align: left;
    }

    .login-box label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 500;
    }

    .login-box input[type="email"],
    .login-box input[type="password"] {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: none;
      border-radius: 15px;
      font-size: 14px;
    }

    .login-box .create-account {
      font-size: 13px;
      text-align: center;
      margin-bottom: 20px;
    }

    .login-box .create-account a {
      color: black;
      font-weight: bold;
      text-decoration: underline;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      background-color: #9caee7;
      color: black;
      border: 1px solid black;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .login-box button:hover {
      background-color: #8fa0d6;
    }
  </style>
</head>
<body>

  <img src="imagesHTML/multipower .png" alt="Multipower Logo" class="logo" />

  <div class="login-box">
    <form>
      <label for="email">E-MAIL*</label>
      <input type="email" id="email" name="email" required>

      <label for="senha">PALAVRA PASSE*</label>
      <input type="password" id="senha" name="senha" required>

      <div class="create-account">
        Ainda não tem conta? <a href="criarcontaforne.html">Crie uma!</a>
      </div>

      <button type="submit">ENTRAR</button>
    </form>
  </div>

</body>
</html>
