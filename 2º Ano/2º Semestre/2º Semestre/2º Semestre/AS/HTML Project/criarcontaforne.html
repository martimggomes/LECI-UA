<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Criação de Conta - Fornecedor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background-color: #f5f5f5;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      width: 80px;
    }

    .welcome {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin: 30px 0;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: space-between;
    }

    .form-group {
      flex: 0 0 48%;
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .form-group input, select {
      padding: 12px;
      border: 1px solid #999;
      border-radius: 5px;
      background-color: #a4ade1;
      color: black;
    }

    .hint {
      font-size: 12px;
      color: #555;
      margin-top: 5px;
    }

    .password-rules {
      font-size: 12px;
      color: #555;
      margin-top: 10px;
    }

    .full-width {
      flex: 0 0 100%;
      margin-top: 20px;
    }

    .submit-button {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      background-color: #a4ade1;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .submit-button:hover {
      background-color: #9098cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="imagesHTML/logo.jpg" alt="Logo Multipower" />
      <span><strong>MultiPower</strong></span>
    </div>

    <div class="welcome">
      BEM VINDO!! 👋
    </div>

    <form action="criacaocontaforne.html" method="get">
        <div class="form-group">
          <label for="email">E-MAIL EMPRESARIAL*</label>
          <input type="email" id="email" name="email" placeholder="example@domain.com" required />
          <div class="hint">example@domain.com</div>
        </div>
      
        <div class="form-group">
          <label for="empresa">NOME DA EMPRESA*</label>
          <input type="text" id="empresa" name="empresa" required />
        </div>
      
        <div class="form-group">
          <label for="password">PALAVRA PASSE*</label>
          <input type="password" id="password" name="password" required />
          <div class="password-rules">
            • Pelo menos 8 caracteres<br />
            • Pelo menos um número<br />
            • Pelo menos uma letra maiúscula e uma minúscula
          </div>
        </div>
      
        <div class="form-group">
          <label for="localizacao">LOCALIZAÇÃO DOS POSTOS DE CARREGAMENTO*</label>
          <input type="text" id="localizacao" name="localizacao" required />
        </div>
      
        <div class="form-group">
          <label for="indicativo">TELEMÓVEL*</label>
          <div style="display: flex; gap: 10px;">
            <select id="indicativo" name="indicativo" required>
              <option value="+351">+351</option>
              <option value="+55">+55</option>
              <option value="+244">+244</option>
            </select>
            <input type="tel" id="telemovel" name="telemovel" required />
          </div>
        </div>
      
        <div class="full-width">
          <button type="submit" class="submit-button">CRIAR CONTA ➔</button>
        </div>
      </form>
  </div>
</body>
</html>
