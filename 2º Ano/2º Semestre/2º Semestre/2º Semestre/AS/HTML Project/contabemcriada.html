<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Conta Criada</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
      color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      margin: 0;
    }

    .check-icon {
      font-size: 64px;
      color: #1c1c1c;
      margin-bottom: 20px;
    }

    .message {
      font-size: 20px;
      margin-bottom: 40px;
    }

    .back-button {
      background-color: #9caee7;
      border: 1px solid #000;
      padding: 15px 30px;
      border-radius: 5px;
      font-weight: bold;
      text-decoration: none;
      color: #000;
      transition: background-color 0.3s ease;
    }

    .back-button:hover {
      background-color: #8fa0d6;
    }
  </style>
</head>
<body>

  <div class="check-icon">✔</div>

  <div class="message">
    A sua conta foi criada com sucesso, agora faz parte da família MultiPower!
  </div>

  <a href="criacaocontaforne.html" class="back-button">Voltar para a página inicial</a>

</body>
</html>
